services:
  qwen2api:
    container_name: qwen2api
    build:
      context: ..
      dockerfile: Dockerfile
    image: qwen2api:local
    restart: always
    env_file:
      - ../.env
    ports:
      - "3000:3000"
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    environment:
      # Overrides from .env for redis mode
      - REDIS_URL=redis://redis:6379
      - DATA_SAVE_MODE=redis
    depends_on:
      - redis

  redis:
    image: redis:7.2-alpine
    container_name: redis_qwen2api
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
